name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限就够了。
permissions:
  contents: read

jobs:
  node:
    name: Node 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

  shell:
    name: 桌面外壳测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test
        working-directory: build/desktop
